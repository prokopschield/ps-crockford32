[package]
name = "ps-crockford32"
version = "0.1.0-1"
edition = "2021"
rust-version = "1.81"
description = "Crockford Base32 encode/decode"
readme = "README.md"
repository = "https://github.com/prokopschield/ps-crockford32"
license = "GPL-3.0-or-later"
keywords = ["base32", "crockford", "encoding", "no-std"]
categories = ["encoding", "no-std", "no-std::no-alloc"]
exclude = ["/.github", "/fuzz"]

[features]
default = ["alloc"]
alloc = []

[lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
expect_used = "warn"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
